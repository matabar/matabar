# Tool versions live next to the project that uses them (infra/.tool-versions,
# apps/site/.tool-versions); node is pinned in the root .tool-versions. This
# file defines tasks.
# Checks are Nx targets (see nx.json and each project.json); these tasks call Nx.

[tasks."install:tools"]
description = "Install every pinned tool: mise reads the config of the directory it runs in and its parents, so run it in each project"
run = """
(cd infra && mise install)
(cd apps/site && mise install)
"""

[tasks.install]
description = "Install every pinned tool, then the Node tooling (Nx, html-validate) from the lockfile"
depends = ["install:tools"]
run = "npm ci --ignore-scripts"

[tasks.check]
description = "Run the pull request checks locally on the projects affected by your changes"
depends = ["install"]
run = "npx nx affected -t fmt validate tflint trivy html links"

[tasks."check:all"]
description = "Run every check on every project, ignoring what changed"
depends = ["install"]
run = "npx nx run-many -t fmt validate tflint trivy html links"

[tasks.pre-commit]
description = "Git pre-commit hook: refuse commits on main, format staged HCL and Terraform files. Install with: mise generate git-pre-commit --write --task=pre-commit"
run = """
[ "$(git branch --show-current)" != main ] || { echo "Commits on main are blocked: use a feature branch." >&2; exit 1; }
for f in $STAGED; do
  [ -f "$f" ] || continue
  case "$f" in
    *.tf) tofu fmt "$f" ;;
    *.hcl) terragrunt hcl format --file "$f" ;;
    *) continue ;;
  esac
  git add -- "$f"
done
"""
