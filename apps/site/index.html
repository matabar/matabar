<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>matabar.online</title>
  <meta name="description" content="matabar.online">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="matabar.online">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://matabar.online/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f0c'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='15' font-weight='700' fill='%2340d97a' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f6f3;
      --fg: #1a1f1b;
      --accent: #0a7a3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f0c;
        --fg: #d7e2d9;
        --accent: #40d97a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 6.5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .prompt { color: var(--accent); }
    .cursor {
      display: inline-block;
      width: .55em;
      height: 1em;
      margin-left: .15em;
      vertical-align: -0.12em;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1><span class="prompt" aria-hidden="true">$ </span>matabar.online<span class="cursor" aria-hidden="true"></span></h1>
  </main>
</body>
</html>
