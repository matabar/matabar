<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>matabar.online</title>
  <meta name="description" content="matabar.online">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --rule: #e7e5e4;
      --accent: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --rule: #292524;
        --accent: #5eead4;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 34rem; }
    h1 {
      margin: 0 0 .25rem;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    h1 span { color: var(--accent); }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    nav {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }
    a { color: var(--fg); text-decoration-color: var(--rule); text-underline-offset: 3px; }
    a:hover, a:focus-visible { text-decoration-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>matabar<span>.</span>online</h1>
    <p>Personal projects, infrastructure, and notes.</p>
    <nav>
      <a href="https://github.com/matabar">GitHub</a>
      <a href="https://github.com/matabar/personal-infra">How this site is built</a>
    </nav>
  </main>
</body>
</html>
