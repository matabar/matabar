version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # One glob covers every module, so a new module under infra/modules/<provider>/<name>
  # is picked up without editing this file.
  - package-ecosystem: terraform
    directories:
      - /infra/modules/*/*
    schedule:
      interval: weekly
    labels:
      - dependencies
      - infra
    # A provider bump that touches several modules arrives as one pull request.
    groups:
      terraform-providers:
        patterns:
          - "*"

  # html-validate for the apps/site checks, pinned with its dependencies in
  # .github/site-checks/package-lock.json. A change here runs only the site jobs.
  # lychee and node are pinned in .tool-versions, which no Dependabot ecosystem reads.
  - package-ecosystem: npm
    directory: /.github/site-checks
    schedule:
      interval: weekly
    labels:
      - dependencies
      - site
