version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infra/modules/gcp/project
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/modules/gcp/storage-bucket
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/modules/gcp/dns-zone
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/modules/gcp/github-wif
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/modules/github/repos
    schedule:
      interval: weekly
