version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # One glob covers every module, so a new module under infra/modules/<provider>/<name>
  # is picked up without editing this file.
  - package-ecosystem: terraform
    directories:
      - /infra/modules/*/*
    schedule:
      interval: weekly
    labels:
      - dependencies
      - infra
    # A provider bump that touches several modules arrives as one pull request.
    groups:
      terraform-providers:
        patterns:
          - "*"

  # Nx and html-validate, pinned with their dependencies in the root
  # package-lock.json. A lockfile change affects every project. node, lychee
  # and the infra tools are pinned in .tool-versions files, which no Dependabot
  # ecosystem reads.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
