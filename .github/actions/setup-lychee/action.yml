name: Setup lychee
description: Install the lychee version pinned in .tool-versions, verified by sha256.

runs:
  using: composite
  steps:
    - name: Install lychee
      shell: bash
      run: |
        set -euo pipefail
        test "$(awk '$1 == "lychee" { print $2 }' .tool-versions)" = "0.24.2"
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/lychee.tar.gz" \
          https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
        echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $tmp/lychee.tar.gz" | sha256sum -c -
        tar -xzf "$tmp/lychee.tar.gz" -C "$tmp"
        install -m 0755 "$(find "$tmp" -name lychee -type f | head -n1)" /usr/local/bin/lychee
        rm -rf "$tmp"
