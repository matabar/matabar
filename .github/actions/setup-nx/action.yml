name: Setup Nx
description: >-
  Installs the pinned tools with mise, installs Nx from the lockfile and sets
  NX_BASE and NX_HEAD for `nx affected`. Run actions/checkout with
  fetch-depth: 0 first. Callers need `actions: read` for branch pushes.
inputs:
  tools:
    description: Space-separated tools from .tool-versions to install. node is always needed.
    required: true
runs:
  using: composite
  steps:
    - name: Setup tools
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: 2026.11.14
        install_args: ${{ inputs.tools }}
        # Some jobs run with cloud credentials: no shared cache.
        cache: false
    - name: Install Nx
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    # Pull requests: the merge base with the base branch. Branch pushes: this
    # workflow never runs on main, so the action finds no earlier run and falls
    # back to origin/main (Nx diffs against the merge base).
    - name: Set Nx base and head
      uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      with:
        fallback-sha: origin/main
