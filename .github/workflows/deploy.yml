name: Deploy

on:
  push:
    branches:
      - main
  # Full run of every CI-managed unit, e.g. after bootstrap or when a unit
  # landed on main before this workflow existed. There is no diff base, so
  # every unit is planned.
  workflow_dispatch:

permissions:
  contents: read

# One apply at a time. A later push waits; it does not cancel the apply
# that is already holding the state lock.
concurrency:
  group: production-apply
  cancel-in-progress: false

jobs:
  # Plan first with the read-only identity, so the approval below is for a
  # plan that is already visible in this run (job log and artifact).
  plan:
    name: plan
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terragrunt-run.yml
    with:
      mode: plan
      affected: true
      lock: false
      base_revision: ${{ github.event.before }}
      workload_identity_provider: ${{ vars.WIF_PLAN_PROVIDER }}
      service_account: ${{ vars.WIF_PLAN_SERVICE_ACCOUNT }}
      github_pages_challenge: ${{ vars.PAGES_CHALLENGE }}
    secrets: inherit

  # Waits for the production reviewer. Only this job gets an OIDC token
  # with environment=production, which the apply identity requires.
  apply:
    name: apply
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terragrunt-run.yml
    with:
      mode: apply
      affected: true
      lock: true
      base_revision: ${{ github.event.before }}
      environment: production
      workload_identity_provider: ${{ vars.WIF_APPLY_PROVIDER }}
      service_account: ${{ vars.WIF_APPLY_SERVICE_ACCOUNT }}
      github_pages_challenge: ${{ vars.PAGES_CHALLENGE }}
    secrets: inherit
