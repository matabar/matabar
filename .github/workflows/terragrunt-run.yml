name: Terragrunt run

on:
  workflow_call:
    inputs:
      enabled:
        description: Set to false to skip the run. The job then reports as skipped.
        required: false
        type: boolean
        default: true
      mode:
        description: plan or apply
        required: true
        type: string
      affected:
        description: Limit the run to changed units and their dependents
        required: false
        type: boolean
        default: true
      lock:
        description: Allow OpenTofu to lock remote state
        required: false
        type: boolean
        default: false
      base_revision:
        description: Revision to diff against when the event is not a pull request. Required when affected is true; an unknown revision fails the run.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment for the job. Empty runs without one.
        required: false
        type: string
        default: ""
      workload_identity_provider:
        description: Full Workload Identity provider resource name
        required: true
        type: string
      service_account:
        description: Service account email to impersonate
        required: true
        type: string
      github_pages_challenge:
        description: Optional Pages domain verification value
        required: false
        type: string
        default: ""

    outputs:
      changes:
        description: true when the plan adds, changes, destroys, or imports anything
        value: ${{ jobs.run.outputs.changes }}

permissions:
  contents: read

jobs:
  run:
    name: terragrunt
    if: inputs.enabled
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      changes: ${{ steps.tg.outputs.changes }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The secrets context is not available in step conditions.
      HAS_APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Require Workload Identity settings
        env:
          PROVIDER: ${{ inputs.workload_identity_provider }}
          SERVICE_ACCOUNT: ${{ inputs.service_account }}
        run: .github/scripts/require-workload-identity.sh

      - name: Setup tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: opentofu terragrunt tflint trivy
          # These tools run with cloud credentials in some jobs: no shared cache.
          cache: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Create GitHub App token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Terragrunt
        id: tg
        env:
          MODE: ${{ inputs.mode }}
          # Terragrunt's own configuration. TG_FILTER selects the units that
          # changed since the base revision, plus their dependents; empty runs
          # every unit. Pull requests diff against their base SHA, other events
          # against base_revision.
          TG_FILTER: ${{ inputs.affected && format('...[{0}...HEAD]', github.event.pull_request.base.sha || inputs.base_revision) || '' }}
          TG_NON_INTERACTIVE: "true"
          TG_NO_COLOR: "true"
          TF_INPUT: "false"
          TF_CLI_ARGS_plan: ${{ inputs.lock && '' || '-lock=false' }}
          # The App token wins; GH_ADMIN_TOKEN is the fallback. With neither
          # the variable is empty and the GitHub unit excludes itself.
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GH_ADMIN_TOKEN }}
          PAGES_CHALLENGE: ${{ inputs.github_pages_challenge }}
        run: .github/scripts/terragrunt-ci.sh

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terragrunt-${{ inputs.mode }}
          path: |
            .github/ci-out/plan.txt
            .github/ci-out/plan.md
          if-no-files-found: warn
