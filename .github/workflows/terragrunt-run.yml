name: Terragrunt run

on:
  workflow_call:
    inputs:
      mode:
        description: plan, apply, or plan-apply
        required: true
        type: string
      affected:
        description: Limit the run to changed units and their dependents
        required: false
        type: boolean
        default: true
      lock:
        description: Allow OpenTofu to lock remote state
        required: false
        type: boolean
        default: false
      base_revision:
        description: Revision to diff against on push events. Empty or unknown runs every unit.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment for the job. Empty runs without one.
        required: false
        type: string
        default: ""
      workload_identity_provider:
        description: Full Workload Identity provider resource name
        required: true
        type: string
      service_account:
        description: Service account email to impersonate
        required: true
        type: string
      github_pages_challenge:
        description: Optional Pages domain verification value
        required: false
        type: string
        default: ""

    outputs:
      changes:
        description: true when the plan adds, changes, destroys, or imports anything
        value: ${{ jobs.run.outputs.changes }}

permissions:
  contents: read

jobs:
  run:
    name: terragrunt
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      changes: ${{ steps.tg.outputs.changes }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The secrets context is not available in step conditions.
      HAS_APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Require Workload Identity settings
        env:
          PROVIDER: ${{ inputs.workload_identity_provider }}
          SERVICE_ACCOUNT: ${{ inputs.service_account }}
        run: |
          set -euo pipefail
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Set the WIF_PLAN_* or WIF_APPLY_* repository variables from the github-wif outputs."
            exit 1
          fi

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Create GitHub App token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Choose GitHub token
        id: gh-token
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN}" ]; then
            echo "::add-mask::${APP_TOKEN}"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${ADMIN_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "token=${ADMIN_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "No GitHub App key or GH_ADMIN_TOKEN. The GitHub unit will be left out of this run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terragrunt
        id: tg
        env:
          MODE: ${{ inputs.mode }}
          AFFECTED: ${{ inputs.affected }}
          LOCK: ${{ inputs.lock }}
          SKIP_GITHUB: ${{ steps.gh-token.outputs.present != 'true' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REVISION: ${{ inputs.base_revision }}
          GITHUB_TOKEN: ${{ steps.gh-token.outputs.token }}
          PAGES_CHALLENGE: ${{ inputs.github_pages_challenge }}
        run: bash .github/scripts/terragrunt-ci.sh

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terragrunt-${{ inputs.mode }}
          path: .github/ci-out/plan.txt
          if-no-files-found: warn
