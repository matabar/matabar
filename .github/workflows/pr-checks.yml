name: PR checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Maps changed paths to projects. Every other job keys off these outputs.
  # Shared CI and tooling files (.github/, .tool-versions) affect every project.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect affected projects
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            git fetch --no-tags origin main
            base="origin/main"
          fi
          files="$(git -c core.quotePath=false diff --name-only --no-renames "${base}...HEAD")"
          echo "Changed files:"
          printf '%s\n' "$files"
          infra=false
          site=false
          if printf '%s\n' "$files" | grep -Eq '^(infra/|\.github/|\.tool-versions$)'; then
            infra=true
          fi
          if printf '%s\n' "$files" | grep -Eq '^(apps/site/|\.github/|\.tool-versions$)'; then
            site=true
          fi
          echo "infra=${infra}" >> "$GITHUB_OUTPUT"
          echo "site=${site}" >> "$GITHUB_OUTPUT"
          echo "infra=${infra} site=${site}"
  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: OpenTofu fmt
        run: tofu fmt -check -recursive infra
      - name: Terragrunt hcl format
        working-directory: infra
        run: terragrunt hcl format --check

  validate:
    name: validate
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Init and validate
        working-directory: infra
        run: |
          set -euo pipefail
          terragrunt run --all --non-interactive -- init -backend=false -input=false -lockfile=readonly
          terragrunt run --all --non-interactive -- validate -no-color

  tflint:
    name: tflint
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: TFLint
        env:
          # tflint --init downloads the google ruleset from the GitHub API.
          # Unauthenticated calls share a per-IP limit on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --config "${GITHUB_WORKSPACE}/infra/.tflint.hcl"

  trivy:
    name: trivy
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Trivy config
        run: trivy config --config infra/trivy.yaml .

  plan:
    name: plan
    needs: [changes, fmt, validate, tflint, trivy]
    # The called workflow skips its job when infra is not affected, so the
    # "plan / terragrunt" check still reports. Skipped lint jobs must not block it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terragrunt-run.yml
    with:
      enabled: ${{ needs.changes.outputs.infra == 'true' }}
      mode: plan
      affected: true
      lock: false
      # Used on branch pushes; pull requests diff against their base SHA.
      base_revision: origin/main
      workload_identity_provider: ${{ vars.WIF_PLAN_PROVIDER }}
      service_account: ${{ vars.WIF_PLAN_SERVICE_ACCOUNT }}
      github_pages_challenge: ${{ vars.PAGES_CHALLENGE }}
    secrets: inherit

  # Only this job can write to the pull request. The plan job, which holds
  # cloud credentials, cannot.
  plan-comment:
    name: plan-comment
    needs: [changes, plan]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.outputs.infra == 'true' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: terragrunt-plan
          path: plan-log

      - name: Comment on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terragrunt-plan -->';
            let body = '';
            try {
              body = fs.readFileSync('plan-log/plan.txt', 'utf8');
            } catch (error) {
              body = 'Plan log was not produced.';
            }
            const max = 60000;
            if (body.length > max) {
              body = body.slice(0, max) + '\n\n… truncated …';
            }
            const comment = `${marker}\n## Terragrunt plan\n\n\`\`\`\n${body}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((entry) => entry.user.type === 'Bot' && entry.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

  # The single check to require. It always runs and fails when any job that
  # ran failed or was cancelled. Skipped jobs are fine. Add new jobs to needs.
  ci:
    name: ci
    needs: [changes, fmt, validate, tflint, trivy, plan, plan-comment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job that ran to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) echo "A job failed or was cancelled."; exit 1 ;;
          esac
