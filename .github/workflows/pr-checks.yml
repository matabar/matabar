name: PR checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Maps changed paths to projects. Every other job keys off these outputs.
  # Shared CI and tooling files (.github/, .tool-versions) affect every project.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.filter.outputs.infra == 'true' || steps.tools-infra.outputs.infra == 'true' }}
      site: ${{ steps.filter.outputs.site == 'true' || steps.tools-site.outputs.site == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Empty token: diff with git against the base branch instead of the API,
      # so the job needs no pull-requests scope. Branch pushes diff against main.
      - name: Detect affected projects
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: main
          # .github/ affects every project, except .github/site-checks/, which
          # cannot change infra checks or plans. .tool-versions is handled below.
          filters: |
            infra:
              - 'infra/**'
              - '.github/*'
              - '.github/!(site-checks)/**'
            site:
              - 'apps/site/**'
              - '.github/**'
            tools:
              - '.tool-versions'
      # .tool-versions is compared line by line: a site tool bump (node, lychee)
      # skips infra and an infra tool bump (opentofu, terragrunt, tflint,
      # trivy) skips site. paths-filter cannot compare lines.
      - name: Compare infra tool versions
        id: tools-infra
        if: steps.filter.outputs.tools == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: .github/scripts/tool-versions-changed.sh "$BASE" infra output
      - name: Compare site tool versions
        id: tools-site
        if: steps.filter.outputs.tools == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: .github/scripts/tool-versions-changed.sh "$BASE" site output

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: opentofu terragrunt tflint trivy
          # These tools run with cloud credentials in some jobs: no shared cache.
          cache: false
      - name: Format check
        run: .github/scripts/check.sh fmt

  validate:
    name: validate
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: opentofu terragrunt tflint trivy
          # These tools run with cloud credentials in some jobs: no shared cache.
          cache: false
      - name: Init and validate
        run: .github/scripts/check.sh validate

  tflint:
    name: tflint
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: opentofu terragrunt tflint trivy
          # These tools run with cloud credentials in some jobs: no shared cache.
          cache: false
      - name: TFLint
        env:
          # tflint --init downloads the google ruleset from the GitHub API.
          # Unauthenticated calls share a per-IP limit on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check.sh tflint

  trivy:
    name: trivy
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: opentofu terragrunt tflint trivy
          # These tools run with cloud credentials in some jobs: no shared cache.
          cache: false
      - name: Trivy config
        run: .github/scripts/check.sh trivy

  site-html:
    name: site-html
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # check.sh runs npm ci against the committed lockfile.
      - name: HTML validation
        run: .github/scripts/check.sh site-html

  site-links:
    name: site-links
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lychee
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: lychee
          # These tools run with cloud credentials in some jobs: no shared cache.
          cache: false
      # Strict: broken internal links and fragments fail the check. Offline, so
      # it cannot flake on the network.
      - name: Internal links
        run: .github/scripts/check.sh site-links
      # Advisory: external sites can be down or rate-limit CI. Retries are
      # enabled and a failure is an annotated warning, never a failed check.
      - name: External links (advisory)
        run: .github/scripts/check.sh site-links-external || echo "::warning::External link check failed; see the log above."

  plan:
    name: plan
    needs: [changes, fmt, validate, tflint, trivy]
    # The called workflow skips its job when infra is not affected, so the
    # "plan / terragrunt" check still reports. Skipped lint jobs must not block it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terragrunt-run.yml
    with:
      enabled: ${{ needs.changes.outputs.infra == 'true' }}
      mode: plan
      affected: true
      lock: false
      # Used on branch pushes; pull requests diff against their base SHA.
      base_revision: origin/main
      workload_identity_provider: ${{ vars.WIF_PLAN_PROVIDER }}
      service_account: ${{ vars.WIF_PLAN_SERVICE_ACCOUNT }}
      github_pages_challenge: ${{ vars.PAGES_CHALLENGE }}
    secrets: inherit

  # Only this job can write to the pull request. The plan job, which holds
  # cloud credentials, cannot.
  plan-comment:
    name: plan-comment
    needs: [changes, plan]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.outputs.infra == 'true' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: terragrunt-plan
          path: plan-log

      - name: Comment on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terragrunt-plan -->';
            let body = '';
            try {
              body = fs.readFileSync('plan-log/plan.txt', 'utf8');
            } catch (error) {
              body = 'Plan log was not produced.';
            }
            const max = 60000;
            if (body.length > max) {
              body = body.slice(0, max) + '\n\n… truncated …';
            }
            const comment = `${marker}\n## Terragrunt plan\n\n\`\`\`\n${body}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((entry) => entry.user.type === 'Bot' && entry.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

  # The single check to require. It always runs and fails when any job that
  # ran failed or was cancelled. Skipped jobs are fine. Add new jobs to needs.
  ci:
    name: ci
    needs: [changes, fmt, validate, tflint, trivy, site-html, site-links, plan, plan-comment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job that ran to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) echo "A job failed or was cancelled."; exit 1 ;;
          esac
