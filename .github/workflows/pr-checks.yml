name: PR checks

on:
  pull_request:
    # `edited` re-runs the checks when the title changes, so fixing a title
    # turns the title check green without a new commit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  # Local caching only: never connect to Nx Cloud.
  NX_NO_CLOUD: "true"

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Asks Nx which projects the change affects. Every other job keys off the
  # `projects` output. Affected detection and its inputs are in nx.json and
  # each project.json.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node
      - name: List affected projects
        id: affected
        run: .github/scripts/nx-affected-projects.sh

  fmt:
    name: fmt
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'infra')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node opentofu terragrunt tflint trivy
      - name: nx affected fmt
        run: npx nx affected -t fmt

  validate:
    name: validate
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'infra')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node opentofu terragrunt tflint trivy
      - name: nx affected validate
        run: npx nx affected -t validate

  tflint:
    name: tflint
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'infra')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node opentofu terragrunt tflint trivy
      - name: nx affected tflint
        env:
          # tflint --init downloads the google ruleset from the GitHub API.
          # Unauthenticated calls share a per-IP limit on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: npx nx affected -t tflint

  trivy:
    name: trivy
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'infra')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node opentofu terragrunt tflint trivy
      - name: nx affected trivy
        run: npx nx affected -t trivy

  html:
    name: html
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'site')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node
      - name: nx affected html
        run: npx nx affected -t html

  links:
    name: links
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.projects), 'site')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          tools: node lychee
      - name: nx affected links
        run: npx nx affected -t links
      # Advisory: external sites can be down or rate-limit CI. Retries are
      # enabled and a failure never fails the job (it shows on the step).
      - name: External links (advisory)
        continue-on-error: true
        run: npx nx affected -t links-external

  plan:
    name: plan
    needs: [changes, fmt, validate, tflint, trivy]
    # The called workflow skips its job when infra is not affected, so the
    # "plan / terragrunt" check still reports. Skipped lint jobs must not block it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terragrunt-run.yml
    with:
      enabled: ${{ contains(fromJSON(needs.changes.outputs.projects), 'infra') }}
      mode: plan
      affected: true
      lock: false
      # Used on branch pushes; pull requests diff against their base SHA.
      base_revision: origin/main
      workload_identity_provider: ${{ vars.WIF_PLAN_PROVIDER }}
      service_account: ${{ vars.WIF_PLAN_SERVICE_ACCOUNT }}
      github_pages_challenge: ${{ vars.PAGES_CHALLENGE }}
    secrets: inherit

  # Only this job can write to the pull request. The plan job, which holds
  # cloud credentials, cannot.
  plan-comment:
    name: plan-comment
    needs: [changes, plan]
    if: >-
      always() && github.event_name == 'pull_request' &&
      contains(fromJSON(needs.changes.outputs.projects), 'infra') && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: terragrunt-plan
          path: plan-log

      # plan.md is rendered by terragrunt-ci.sh: the plan log in a code block,
      # cut at the size limit. The comment is updated in place by its header.
      - name: Comment on the pull request
        if: hashFiles('plan-log/plan.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terragrunt-plan
          path: plan-log/plan.md

      - name: Comment that no plan was produced
        if: hashFiles('plan-log/plan.md') == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terragrunt-plan
          message: Plan log was not produced.

  # Conventional Commits on the pull request title. Squash merges (the only
  # allowed method) use it as the commit subject on main. Runs on
  # `pull_request`, so fork pull requests get a read-only token and no secrets;
  # the action only reads the title and needs no write permission.
  title:
    name: title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Keep in sync with the commit scopes in AGENTS.md.
          scopes: |
            infra
            site
            ci
            deps
            repo
          requireScope: false

  # The single check to require. It always runs and fails when any job that
  # ran failed or was cancelled. Skipped jobs are fine. Add new jobs to needs.
  ci:
    name: ci
    needs: [changes, title, fmt, validate, tflint, trivy, html, links, plan, plan-comment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Fails when a job failed or was cancelled. Only the listed jobs may be
      # skipped; `changes` must run.
      - name: Require every job that ran to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: title, fmt, validate, tflint, trivy, html, links, plan, plan-comment
