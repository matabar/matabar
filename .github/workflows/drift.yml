name: Drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terragrunt-run.yml
    with:
      mode: plan
      affected: false
      lock: false
      workload_identity_provider: ${{ vars.WIF_PLAN_PROVIDER }}
      service_account: ${{ vars.WIF_PLAN_SERVICE_ACCOUNT }}
      github_pages_challenge: ${{ vars.PAGES_CHALLENGE }}
    secrets: inherit

  issue:
    name: issue
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terragrunt-plan
          path: plan-log

      # Only the lookup script is needed from the repository.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find the open drift issue
        id: find
        env:
          TITLE: Drift detected in matabar
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/find-open-issue.sh

      # plan.md is rendered by terragrunt-ci.sh: the plan log in a code block,
      # cut at the size limit. `changes` is true when the plan adds, changes,
      # destroys or imports anything.
      - name: Open or update the drift issue
        if: needs.plan.outputs.changes == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Drift detected in matabar
          content-filepath: plan-log/plan.md
          issue-number: ${{ steps.find.outputs.number }}

      - name: Close the drift issue
        if: needs.plan.outputs.changes != 'true' && steps.find.outputs.number != ''
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.find.outputs.number }}
          comment: "No drift in the scheduled plan: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
